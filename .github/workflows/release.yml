name: Build Release

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run prebuild

      - name: Build Windows executable
        run: |
          bun build --compile `
            --define LFMPLAYR_VERSION="'${{ github.ref_name }}'" `
            --target=bun-windows-x64 `
            --minify `
            --sourcemap `
            --bytecode `
            --windows-hide-console `
            --windows-icon=./src/assets/icon.ico `
            ./src/server.ts `
            --outfile lfmplayr.exe
        env:
          LFMPLAYR_VERSION: ${{ github.ref_name }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfmplayr-windows-x64
          path: lfmplayr.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run prebuild

      - name: Build Linux executable
        run: |
          bun build --compile \
            --define LFMPLAYR_VERSION="'${{ github.ref_name }}'" \
            --target=bun-linux-x64 \
            --minify \
            --sourcemap \
            --bytecode \
            ./src/server.ts \
            --outfile lfmplayr
        env:
          LFMPLAYR_VERSION: ${{ github.ref_name }}

      - name: Make executable
        run: chmod +x lfmplayr

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfmplayr-linux-x64
          path: lfmplayr

  release:
    name: Create GitHub Release
    needs:
    - build-windows
    - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: lfmplayr-windows-x64
          path: release/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: lfmplayr-linux-x64
          path: release/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/lfmplayr.exe
            release/linux/lfmplayr
          generate_release_notes: true